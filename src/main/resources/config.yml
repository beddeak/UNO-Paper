# UNO 설정
# 게임 중에 바꾼 규칙은 다음 판부터 적용됩니다.

rules:
  # 처음 나눠 주는 카드 수
  hand-size: 7
  # +2·+4·+10을 서로 아무거나 위에 이어 내서 누적 장수를 다음 사람에게 넘기기(+99는 누적에 못 끼고, +99 위에도 못 냄)
  stacking: true
  # 뽑을 때 낼 수 있는 카드(같은 색·같은 숫자/기호·와일드)가 나올 때까지 계속 뽑기 (false면 1장)
  # 덱은 무한입니다. 다 떨어지면 아래 six-cards~plus99-cards 설정대로 만든 새 묶음(기본 133장)을 섞어 채웁니다.
  draw-until-playable: true
  # 1장 남았는데 안 외치다 걸리면 받는 카드 수
  call-penalty: 2
  # 한 턴 제한 시간(초). 0이면 무제한. 시간이 지나면 1장 받고 넘어갑니다.
  turn-seconds: 30
  # 6이 나오면 박수: 모두 아무 데나 클릭하고, 제일 늦은 사람이 1장 받습니다.
  six-clap: true
  # 박수 제한 시간(초). 이 안에 안 누른 사람은 모두 1장 받습니다.
  clap-seconds: 5
  # 덱 한 묶음(다 떨어지면 새로 섞어 채우는 단위)에 넣는 장수. 많을수록 자주 나옵니다(0~40).
  # 나머지 카드는 고정: 색마다 0 한 장, 1~9(6 제외) 두 장씩, 스킵·리버스 두 장씩, 와일드 4장 = 88장.
  # 원래 UNO 비율은 6 8장, +2 8장, +4 4장, +10 0장(108장)입니다. /uno rule 로 보면 확률(%)도 나옵니다.
  six-cards: 16
  plus2-cards: 16
  plus4-cards: 8
  # 와일드 +10: 다음 사람 10장. +2·+4·+10은 서로 아무거나 위에 받아칠 수 있습니다.
  plus10-cards: 4
  # 와일드 +99(무적): 다음 사람이 무조건 99장. +99 위에는 아무것도(+99도) 못 냅니다. 누적(+2·+4·+10)을 받아치는 데는 못 씁니다.
  # 기본 1장 = 133장 중 1장(약 0.75%). 2장이면 약 1.5%.
  plus99-cards: 1

table:
  # /uno table 로 정한 테이블 중심(카드가 놓이는 윗면). 비어 있으면 /uno start 한 사람 위치를 씁니다.
  world: ''
  x: 0.0
  y: 0.0
  z: 0.0
  # 테이블 위에 까는 초록 펠트 크기(블록). 0이면 깔지 않습니다.
  felt-size: 3.0
  # 테이블 위 카드 크기(1 = 블록 높이 정도)
  card-scale: 1.3
  # 시작할 때 테이블 둘레(반지름, 블록)에 플레이어를 둘러 세우기
  seat-radius: 3.0
  teleport-players: true

resource-pack:
  # 카드 그림 리소스팩을 플러그인이 직접 HTTP로 내려줍니다.
  enabled: true
  send-on-join: true
  # true면 리소스팩을 거절한 사람은 접속이 끊깁니다.
  required: false
  # 리소스팩 HTTP 포트. 친구가 외부에서 접속하면 이 포트(TCP)도 포트포워딩해야 합니다.
  port: 8163
  # 비어 있으면 각 플레이어가 서버에 접속할 때 쓴 주소를 그대로 씁니다.
  public-host: ''
  # 다른 곳에 올린 zip 주소를 쓰려면 여기에 적습니다(plugins/UNO/UNO-pack.zip을 그대로 올려야 합니다).
  external-url: ''

game:
  # 게임 중인 플레이어는 피해·배고픔을 받지 않습니다.
  protect-players: true
  # 게임 중에는 어드벤처 모드로 바꾸고 끝나면 원래 모드로 돌려놓습니다(블록 부수기·크리에이티브 인벤토리 방지).
  adventure-mode: true
  # 카드 나눠 주는 간격(틱)
  deal-interval-ticks: 2
  # 뽑기·+2·+4·벌칙으로 받는 카드가 한 장씩 들어오는 간격(틱, 날아오는 0.4초 포함). 뽑기는 한 장마다 맞는지 확인을 보여 줍니다.
  draw-interval-ticks: 16
  # 봇이 한 수 두기 전 기다리는 시간(틱)
  bot-delay-ticks: 30
  # 승리 화면 후 정리까지 기다리는 시간(초)
  finish-seconds: 8
